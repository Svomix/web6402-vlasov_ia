<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <title>DiffGenStories - история</title>
</head>

<body class="page">
<header class="header">
    <a href="index.html" class="header__logo">
        <img src="img/logo.svg" alt="DiffGenStories" class="header__logo-img">
        <span class="header__logo-title">DiffGenStories</span>
    </a>
    <div class="header__right">
        <nav class="nav">
            <a href="chat.html" class="nav__link">Диалог</a>
            <a href="history.html" class="nav__link nav__link_active">История</a>
            <a href="index.html" class="nav__link">Выход</a>
        </nav>
        <div class="user">
            <img src="img/user.svg" alt="Профиль" class="user__avatar">
            <span class="user__name">Гость</span>
        </div>
    </div>
</header>
<main class="history">
    <div class="history__card">
        <h1 class="history__title">История генерации</h1>
        <div class="history-table">
            <div class="history-table__row history-table__row_head">
                <div class="history-table__header">Превью</div>
                <div class="history-table__header">Промпт и текстовый контекст сцены</div>
                <div class="history-table__header">Используемая модель</div>
                <div class="history-table__header history-table__header_center">Статус</div>
                <div class="history-table__header history-table__header_center">Время создания</div>
                <div class="history-table__header history-table__header_center">Действие</div>
            </div>

            <div class="history-table__row history-table__row_item">
                <div class="history-table__cell">
                    <img src="img/scene1.svg" alt="Сцена" class="history-table__preview">
                </div>
                <div class="history-table__cell history-table__cell_center" >Космическая станция</div>
                <div class="history-table__cell">SDXL 1.0 + LoRA</div>
                <div class="history-table__cell history-table__cell_center">
                    <span class="status">Готово</span>
                </div>
                <div class="history-table__cell history-table__cell_center">14.8с</div>
                <div class="history-table__cell history-table__cell_right">
                    <a href="chat.html" class="history-table__link">Открыть в диалоге</a>
                </div>
            </div>

            <div class="history-table__row history-table__row_item">
                <div class="history-table__cell">
                    <img src="img/scene2.svg" alt="Сцена" class="history-table__preview">
                </div>
                <div class="history-table__cell history-table__cell_center">Киберпанк город</div>
                <div class="history-table__cell">Stable Diffusion 2.1</div>
                <div class="history-table__cell history-table__cell_center">
                    <span class="status">Готово</span>
                </div>
                <div class="history-table__cell history-table__cell_center">18.2с</div>
                <div class="history-table__cell history-table__cell_right">
                    <a href="chat.html" class="history-table__link">Открыть в диалоге</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
