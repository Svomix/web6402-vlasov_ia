<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="fog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="600" height="400" fill="url(#sky1)"/>
  <circle cx="450" cy="180" r="45" fill="#fef08a" opacity="0.8"/>
  <!-- Distant Pine Trees -->
  <path d="M50 400 L90 220 L130 400 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M110 400 L160 200 L210 400 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M380 400 L440 190 L500 400 Z" fill="#1e293b" opacity="0.5"/>
  <path d="M480 400 L540 210 L600 400 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Fog layer -->
  <rect y="200" width="600" height="200" fill="url(#fog)"/>
  <!-- Foreground ground -->
  <path d="M0 340 Q 300 310 600 350 L600 400 L0 400 Z" fill="#0f172a"/>
  <!-- Foreground Trees -->
  <polygon points="20,400 60,160 100,400" fill="#090d16"/>
  <polygon points="500,400 550,150 600,400" fill="#090d16"/>
  <!-- Knight Figure (Consistent Character: Dark Hair, Silver Armor, Blue Cloak) -->
  <g transform="translate(260, 210)">
    <!-- Blue Cloak -->
    <path d="M25 45 L5 140 L75 140 L55 45 Z" fill="#2563eb"/>
    <!-- Armor Body -->
    <rect x="22" y="42" width="36" height="55" rx="6" fill="url(#armor)"/>
    <!-- Dragon crest emblem -->
    <circle cx="40" cy="65" r="7" fill="#1d4ed8"/>
    <!-- Head / Dark Hair -->
    <circle cx="40" cy="25" r="14" fill="#fed7aa"/>
    <path d="M26 22 Q 40 8 54 22 Q 52 12 40 12 Q 28 12 26 22 Z" fill="#0f172a"/>
    <!-- Legs in armor -->
    <rect x="24" y="97" width="12" height="43" fill="#64748b"/>
    <rect x="44" y="97" width="12" height="43" fill="#475569"/>
    <!-- Sword -->
    <line x1="16" y1="50" x2="16" y2="130" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="8" y1="65" x2="24" y2="65" stroke="#f59e0b" stroke-width="4"/>
  </g>
  <!-- Text Label -->
  <rect x="15" y="15" width="230" height="32" rx="8" fill="#000000" opacity="0.65"/>
  <text x="25" y="36" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Сцена 1: Лес на рассвете</text>
</svg>
