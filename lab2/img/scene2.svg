<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="armor2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="600" height="400" fill="url(#sky2)"/>
  <!-- Stars -->
  <circle cx="100" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="250" cy="70" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="480" cy="40" r="2" fill="#ffffff" opacity="0.9"/>
  <!-- Ancient Ruined Temple Columns -->
  <rect x="360" y="80" width="45" height="260" fill="url(#stone)"/>
  <rect x="470" y="60" width="50" height="280" fill="url(#stone)"/>
  <polygon points="340,90 530,50 530,70 340,105" fill="#1e293b"/>
  <!-- Glowing Runes on Columns -->
  <path d="M382 140 L382 180 M375 150 L390 160 M375 170 L390 160" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="495" cy="160" r="8" fill="none" stroke="#a855f7" stroke-width="3"/>
  <path d="M495 190 L495 230 M490 205 L500 205" stroke="#a855f7" stroke-width="3"/>
  <!-- Steps / Ground -->
  <path d="M0 340 L600 330 L600 400 L0 400 Z" fill="#090d16"/>
  <rect x="300" y="340" width="300" height="15" fill="#1e293b"/>
  <rect x="320" y="355" width="280" height="15" fill="#334155"/>
  <!-- Knight Figure (Consistent: Same Dark Hair, Silver Armor, Blue Cloak, Dragon Crest) -->
  <g transform="translate(180, 200)">
    <!-- Blue Cloak -->
    <path d="M25 45 L5 140 L75 140 L55 45 Z" fill="#2563eb"/>
    <!-- Armor Body -->
    <rect x="22" y="42" width="36" height="55" rx="6" fill="url(#armor2)"/>
    <!-- Dragon crest emblem -->
    <circle cx="40" cy="65" r="7" fill="#1d4ed8"/>
    <!-- Head / Dark Hair -->
    <circle cx="40" cy="25" r="14" fill="#fed7aa"/>
    <path d="M26 22 Q 40 8 54 22 Q 52 12 40 12 Q 28 12 26 22 Z" fill="#0f172a"/>
    <!-- Legs in armor -->
    <rect x="24" y="97" width="12" height="43" fill="#64748b"/>
    <rect x="44" y="97" width="12" height="43" fill="#475569"/>
    <!-- Sword in Hand Pointing Forward -->
    <line x1="55" y1="70" x2="110" y2="90" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="58" y1="62" x2="63" y2="78" stroke="#f59e0b" stroke-width="4"/>
  </g>
  <!-- Text Label -->
  <rect x="15" y="15" width="250" height="32" rx="8" fill="#000000" opacity="0.65"/>
  <text x="25" y="36" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">Сцена 2: Врата древнего храма</text>
</svg>
