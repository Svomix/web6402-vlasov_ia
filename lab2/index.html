<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title> DiffGenStories - авторизация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <div class="logo">
        <a href="index.html" class="logo">
            <img src="img/logo.svg" alt="DiffGenStories">
            <span class="logo-title">DiffGenStories</span>
        </a>
    </div>
</header>
<main class="login-window">
    <div class="login">
        <h1>Вход в систему</h1>
        <form action="chat.html" method="POST">
            <label> Ваш email:
                <input type="email" required placeholder="example@mail.com" name="email">
            </label>
            <label> Ваш пароль
                <input type="password" required placeholder="1231231" name="password">
            </label>
            <div class="login-options">
                <label> Запомнить меня
                    <input type="checkbox" name="remember_me">
                </label>
                <a href="#" class="link1"> Забыли пароль</a>
            </div>
            <button type="submit"> Войти</button>
        </form>
    </div>
</main>
</body>
</html>
